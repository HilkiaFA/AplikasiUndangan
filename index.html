<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Ticket & Kehadiran</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="app-container">
      <nav class="bottom-nav">
        <button
          onclick="switchTab('guest')"
          class="nav-btn active"
          id="btn-guest"
        >
          <i class="fas fa-ticket-alt"></i><span>Tiket Saya</span>
        </button>
        <button onclick="switchTab('scanner')" class="nav-btn" id="btn-scanner">
          <i class="fas fa-qrcode"></i><span>Scanner</span>
        </button>
        <button onclick="switchTab('setup')" class="nav-btn" id="btn-setup">
          <i class="fas fa-database"></i><span>Data</span>
        </button>
      </nav>

      <div class="content-area">
        <section id="guest" class="tab-content active">
          <div class="header-title">
            <h2>Cari Undangan</h2>
            <p>Masukkan nama atau ID Anda untuk mendapatkan E-Ticket.</p>
          </div>

          <div class="search-box">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="guestSearch"
              placeholder="Contoh: Budi atau INV001"
            />
            <button onclick="findGuest()">Cari</button>
          </div>

          <div id="guest-result" class="ticket hidden">
            <div class="ticket-header">
              <h3><i class="fas fa-star"></i> INVITATION PASS</h3>
            </div>
            <div class="ticket-body">
              <span class="label">Nama Tamu</span>
              <h2 id="guest-name-display">Nama Tamu</h2>

              <div class="badge" id="guest-category-display">Kategori</div>

              <div class="qr-wrapper">
                <div id="qrcode-container"></div>
              </div>

              <p id="guest-instruction" class="instruction"></p>
            </div>
          </div>
        </section>

        <section id="scanner" class="tab-content">
          <div class="header-title">
            <h2>Scan Tiket</h2>
            <p>Arahkan kamera ke QR Code tamu.</p>
          </div>

          <div class="scanner-wrapper">
            <div id="reader"></div>
          </div>

          <div id="scan-result" class="status-msg"></div>

          <div class="manual-checkin">
            <p>Atau input manual (Tamu Fisik):</p>
            <div class="search-box">
              <i class="fas fa-keyboard"></i>
              <input
                type="text"
                id="manualInput"
                placeholder="Ketik nama tamu..."
              />
              <button onclick="manualCheckIn()">Hadir</button>
            </div>
          </div>
        </section>

        <section id="setup" class="tab-content">
          <div class="header-title">
            <h2>Daftar Kehadiran</h2>
            <p>Data tersinkronisasi otomatis dengan Google Sheets.</p>
          </div>

          <div class="table-container">
            <table id="guestTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nama</th>
                  <th>Kategori</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <button onclick="fetchData()" class="btn-refresh">
            <i class="fas fa-sync"></i> Refresh Data
          </button>
        </section>
      </div>
    </div>

    <script>
      const originalSwitchTab = window.switchTab;
      window.switchTab = function (tabId) {
        document
          .querySelectorAll(".nav-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.getElementById("btn-" + tabId).classList.add("active");
        if (typeof originalSwitchTab === "function") originalSwitchTab(tabId);
      };
    </script>
    <script src="script.js"></script>
  </body>
</html>
